[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "primesim-bridge"
version = "0.1.0"
description = "Python bridge for Synopsys PrimeSim (Pro/SPICE) simulation — companion to virtuoso-bridge-lite"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "primesim-bridge contributors" }]
dependencies = [
    "pydantic>=2.0",
]

[project.scripts]
primesim-bridge = "primesim_bridge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/primesim_bridge"]
